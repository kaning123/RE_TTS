[project]
name = "re-tts"
version = "0.1.4_Alpha20260901"
description = "A Simple TTS tool based on RVC 2.2.231006 and edge-tts"
readme = "README.md"
authors = [
    { name = "Kaning123", email = "kaning123official@163.com" }
]
requires-python = ">=3.13"
dependencies = [
    "rich>=15.0.0",
    "rpyc>=6.0.2",
]

[project.scripts]
re-tts = "re_tts:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
